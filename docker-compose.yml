version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: enterprise_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Inside Docker's network, containers reach each other by SERVICE NAME,
      # not "localhost" -- "localhost" inside the backend container would mean
      # the backend container itself, not the qdrant/redis/postgres containers.
      QDRANT_URL: http://qdrant:6333
      REDIS_HOST: redis
      DATABASE_URL: postgresql://postgres:devpassword@postgres:5432/enterprise_rag
      OLLAMA_URL: http://host.docker.internal:11434  # Ollama runs on your HOST machine, not in a container
    depends_on:
      - qdrant
      - redis
      - postgres
    volumes:
      - ./backend/data:/app/data
      - ./backend/storage:/app/storage

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  qdrant_data:
  postgres_data:
